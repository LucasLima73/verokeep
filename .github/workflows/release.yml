name: Release

# Builds a native Linux binary with GraalVM and publishes it to the GitHub
# Release for the pushed tag. Trigger it by creating and pushing a tag:
#
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  native-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native binary
        run: ./gradlew nativeCompile --no-daemon

      - name: Package binary
        run: |
          mkdir -p dist
          cp build/native/nativeCompile/verokeep dist/verokeep-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/verokeep-linux-x86_64
          generate_release_notes: true
